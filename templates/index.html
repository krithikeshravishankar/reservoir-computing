<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Page</title>
    <style>
        /* This is a CSS comment */
        body {
            background-color: #f0f8ff; /* A light aliceblue background */
            font-family: sans-serif;
            text-align: center; /* Center all the text inside the body */
        }
        h1 {
            color: #4682b4; /* A nice steelblue color */
        }
        button {
            background-color: #4682b4;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer; /* Changes the mouse to a pointer on hover */
        }
    </style>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

    <h1>Reservoir Computing Forecast</h1>
    <p>Click the button to run the forecast and generate plots.</p>

    <form action="/" method="post">
        <button type="submit">Forecast</button>
    </form>

    {# This block will only appear if the 'plots' variable exists. #}
    {% if plots %}
        <div style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            <h2>Forecast Results</h2>
            <img src="{{ url_for('static', filename=plots['3d']) }}" alt="3D Trajectory Plot">
            <img src="{{ url_for('static', filename=plots['components']['X']) }}" alt="X Component Plot">
            <img src="{{ url_for('static', filename=plots['components']['Y']) }}" alt="Y Component Plot">
            <img src="{{ url_for('static', filename=plots['components']['Z']) }}" alt="Z Component Plot">
        </div>
    {% endif %}
</body>
</html>
